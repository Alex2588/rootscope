name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootscope
          POSTGRES_PASSWORD: rootscope
          POSTGRES_DB: rootscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        # Definitions can't be mounted (service containers start before checkout), so the
        # broker boots with a default admin and the definitions are imported below.
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://rootscope:rootscope@localhost:5432/rootscope_test
      RABBITMQ_URL: amqp://rootscope:rootscope@localhost:5672/rootscope_test
      RABBITMQ_MANAGEMENT_URL: http://localhost:15672
      RABBITMQ_ADMIN_USER: admin
      RABBITMQ_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v5
      # Retrying the POST may import twice; definitions are declarative, so that converges.
      - name: Import RabbitMQ definitions
        run: >
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 2
          -u admin:admin -H "content-type: application/json"
          -X POST --data @infra/rabbitmq/definitions.local.json
          "$RABBITMQ_MANAGEMENT_URL/api/definitions"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rootscope:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
